name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name ProPomodoro --collect-all kivy --collect-all plyer main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProPomodoro-Windows-EXE
          path: dist/ProPomodoro/
